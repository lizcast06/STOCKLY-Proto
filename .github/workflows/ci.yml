name: STOCKLY CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockly
          POSTGRES_PASSWORD: stockly
          POSTGRES_DB: stockly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockly -d stockly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stockly:stockly@localhost:5432/stockly?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
