services:
  - type: web
    name: stockly-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stockly-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://stockly-web.onrender.com

  - type: web
    name: stockly-web
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist/web
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_URL
        value: https://stockly-api-p6cl.onrender.com

databases:
  - name: stockly-db
    databaseName: stockly
    user: stockly
    plan: free
